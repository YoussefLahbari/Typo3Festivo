<article class="event-card">
    <f:if condition="{event.media}">
        <f:then>
            <div class="event-card__media">
                <div class="event-card__date">
                    <span>{event.eventDate -> f:format.date(format: 'M')}</span>
                    <span>{event.eventDate -> f:format.date(format: 'd')}</span>
                </div>

                <f:image image="{event.media.0}" alt="{event.title}" class="event-card__media-image" />
            </div>
        </f:then>
    </f:if>

    <div class="event-card__body">
        <h3 class="event-card__title">{event.title}</h3>
        <p class="event-card__text">{event.subtitle}</p>

        <div class="event-card__meta">
            <span class="event-card__location">{event.location.0.title}</span>
            <f:if condition="{event.eventPrice}">
                <strong class="event-card__price">{event.eventPrice}.00$</strong>
            </f:if>
        </div>

        <f:if condition="{event.categories}">
            <div class="event-card__taxonomies event-card__taxonomies--categories">
                <f:for each="{event.categories}" as="category">
                    <span class="event-card__taxonomy">{category.title}</span>
                </f:for>
            </div>
        </f:if>

        <f:if condition="{event.tags}">
            <div class="event-card__taxonomies event-card__taxonomies--tags">
                <f:for each="{event.tags}" as="tag">
                    <span class="event-card__taxonomy">{tag.title}</span>
                </f:for>
            </div>
        </f:if>

        <a href="#" class="event-card__button">View Event</a>
    </div>
</article>

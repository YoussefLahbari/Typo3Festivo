<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" 
      data-namespace-typo3-fluid="true">
      

<f:if condition="{events -> f:count()} > 0">
    <f:then>
            <f:render partial="EventList" arguments="{events: events}" />
    </f:then>
    <f:else>
        <div class="references-no-results">
            <div class="no-results-container">
                <div class="no-results-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        <line x1="8" y1="11" x2="14" y2="11"></line>
                    </svg>
                </div>
                <h3>No events found</h3>
                <p>We couldn't find any events matching your search criteria. Please try different filters or reset your search.</p>
                <button type="button" class="btn-reset reset-filter">Reset Filters</button>
            </div>
        </div>
    </f:else>
</f:if>

</html>
